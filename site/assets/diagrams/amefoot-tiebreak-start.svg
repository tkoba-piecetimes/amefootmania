<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
<title>同点の延長（タイブレーク）の始め方。攻撃側は相手のゴールラインまで25ヤードの地点からスナップで攻撃を始め、表と裏で両チームが1回ずつ攻撃する</title>
<rect width="640" height="440" fill="#ffffff"/>
<rect x="70" y="60" width="540" height="130" rx="6" fill="#e8f3e8" stroke="#9aa3b2" stroke-width="1"/>
<rect x="530" y="60" width="80" height="130" fill="#cfe3cf"/>
<rect x="70" y="60" width="540" height="130" rx="6" fill="none" stroke="#9aa3b2" stroke-width="1"/>
<line x1="490" y1="60" x2="490" y2="190" stroke="#c7dcc7" stroke-width="1"/>
<line x1="450" y1="60" x2="450" y2="190" stroke="#c7dcc7" stroke-width="1"/>
<line x1="410" y1="60" x2="410" y2="190" stroke="#c7dcc7" stroke-width="1"/>
<line x1="370" y1="60" x2="370" y2="190" stroke="#c7dcc7" stroke-width="1"/>
<line x1="330" y1="60" x2="330" y2="190" stroke="#c7dcc7" stroke-width="1"/>
<line x1="290" y1="60" x2="290" y2="190" stroke="#c7dcc7" stroke-width="1"/>
<line x1="250" y1="60" x2="250" y2="190" stroke="#c7dcc7" stroke-width="1"/>
<line x1="210" y1="60" x2="210" y2="190" stroke="#c7dcc7" stroke-width="1"/>
<line x1="170" y1="60" x2="170" y2="190" stroke="#c7dcc7" stroke-width="1"/>
<line x1="130" y1="60" x2="130" y2="190" stroke="#c7dcc7" stroke-width="1"/>
<line x1="90" y1="60" x2="90" y2="190" stroke="#c7dcc7" stroke-width="1"/>
<line x1="530" y1="60" x2="530" y2="190" stroke="#1f2a44" stroke-width="4"/>
<line x1="130" y1="60" x2="130" y2="190" stroke="#1f2a44" stroke-width="2"/>
<text x="130" y="210" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">50</text>
<line x1="330" y1="60" x2="330" y2="190" stroke="#f2a900" stroke-width="5"/>
<text x="330" y="210" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">25</text>
<text x="530" y="210" font-size="14" text-anchor="middle" fill="#1f2a44" font-weight="bold">ゴールライン</text>
<text x="570" y="128" font-size="14" text-anchor="middle" fill="#1f2a44" font-weight="bold">エンド</text>
<text x="570" y="146" font-size="14" text-anchor="middle" fill="#1f2a44" font-weight="bold">ゾーン</text>
<circle cx="306" cy="125" r="14" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<ellipse cx="324" cy="125" rx="10" ry="6" fill="#f2a900" stroke="#1f2a44" stroke-width="1.5"/>
<line x1="340" y1="125" x2="518" y2="125" stroke="#1f2a44" stroke-width="2.5"/>
<polygon points="518.0,125.0 509.0,129.5 509.0,120.5" fill="#1f2a44"/>
<text x="326" y="92" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">ここから攻撃スタート</text>
<line x1="332" y1="160" x2="528" y2="160" stroke="#1f2a44" stroke-width="2"/>
<polygon points="528.0,160.0 519.0,164.5 519.0,155.5" fill="#1f2a44"/>
<line x1="528" y1="160" x2="332" y2="160" stroke="#1f2a44" stroke-width="2"/>
<polygon points="332.0,160.0 341.0,155.5 341.0,164.5" fill="#1f2a44"/>
<text x="430" y="153" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">25ヤード</text>
<text x="78" y="86" font-size="14" text-anchor="start" fill="#1f2a44" font-weight="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">攻める向き →</text>
<circle cx="34" cy="257" r="13" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="34" y="262" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text>
<text x="58" y="262" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">コイントスで、先に攻めるチームなどを決める</text>
<circle cx="34" cy="291" r="13" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="34" y="296" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text>
<text x="58" y="296" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">先攻は、相手のゴールラインまで25ヤードの地点から攻撃を始める</text>
<circle cx="34" cy="325" r="13" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="34" y="330" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text>
<text x="58" y="330" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">得点するか、攻撃を続けられなくなったら先攻の攻撃は終わり</text>
<circle cx="34" cy="359" r="13" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="34" y="364" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">4</text>
<text x="58" y="364" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">次は後攻が、同じ25ヤード地点から攻撃する（先攻・後攻で1セット）</text>
<circle cx="34" cy="393" r="13" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="34" y="398" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">5</text>
<text x="58" y="398" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">1セットで得点が多い方が勝ち。同点ならもう1セット</text>
<text x="24" y="430" font-size="13" text-anchor="start" fill="#1f2a44" font-weight="normal">※KCFAの試合の同点決着で使われている「タイブレイク」の流れ（細かい条件は規則書で確認）</text>
</svg>
