<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
<title>オフェンス11人の並び方の一例。スクリメージライン上にオフェンスライン（C・G・T）5人とTE、外側にWR、後ろにQB・RB・もう1人のWR</title>
<rect width="640" height="500" fill="#ffffff"/>
<line x1="20" y1="90" x2="620" y2="90" stroke="#1f2a44" stroke-width="2" stroke-dasharray="8 6"/>
<text x="24" y="81" font-size="14" text-anchor="start" fill="#1f2a44" font-weight="bold">スクリメージライン</text>
<circle cx="320" cy="112" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="320" y="117.5" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">C</text>
<circle cx="270" cy="112" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="270" y="117.5" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">G</text>
<circle cx="370" cy="112" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="370" y="117.5" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">G</text>
<circle cx="220" cy="112" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="220" y="117.5" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">T</text>
<circle cx="420" cy="112" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="420" y="117.5" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">T</text>
<circle cx="470" cy="112" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="470" y="117.5" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">TE</text>
<circle cx="75" cy="112" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="75" y="117.5" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">WR</text>
<circle cx="575" cy="112" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="575" y="117.5" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">WR</text>
<circle cx="160" cy="168" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="160" y="173.5" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">WR</text>
<circle cx="320" cy="172" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="320" y="177.5" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">QB</text>
<circle cx="320" cy="242" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="320" y="247.5" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">RB</text>
<path d="M203,76 v-8 h234 v8" fill="none" stroke="#f2a900" stroke-width="3"/>
<text x="320" y="56" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">OL（オフェンスライン）</text>
<line x1="590" y1="240" x2="590" y2="180" stroke="#1f2a44" stroke-width="2.5"/>
<polygon points="590.0,180.0 594.5,189.0 585.5,189.0" fill="#1f2a44"/>
<text x="590" y="260" font-size="14" text-anchor="middle" fill="#1f2a44" font-weight="bold">攻める向き</text>
<circle cx="38" cy="305" r="13" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="38" y="309.5" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">QB</text>
<text x="62" y="310" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="bold">クォーターバック</text>
<text x="200" y="310" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">攻撃の司令塔。パスを投げる・RBに渡す</text>
<circle cx="38" cy="335" r="13" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="38" y="339.5" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">RB</text>
<text x="62" y="340" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="bold">ランニングバック</text>
<text x="200" y="340" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">ボールをもらって走る</text>
<circle cx="38" cy="365" r="13" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="38" y="369.5" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">WR</text>
<text x="62" y="370" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="bold">ワイドレシーバー</text>
<text x="200" y="370" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">外側に広がり、パスをキャッチする</text>
<circle cx="38" cy="395" r="13" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="38" y="399.5" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">TE</text>
<text x="62" y="400" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="bold">タイトエンド</text>
<text x="168" y="400" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">ブロックとパスキャッチの両方</text>
<circle cx="38" cy="425" r="13" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="38" y="429.5" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">OL</text>
<text x="62" y="430" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="bold">オフェンスライン</text>
<text x="200" y="430" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">壁になってQBと走る道を守る</text>
<text x="62" y="454" font-size="14" text-anchor="start" fill="#1f2a44" font-weight="normal">C=センター（スナップをする）／G=ガード／T=タックル</text>
<text x="24" y="482" font-size="14" text-anchor="start" fill="#1f2a44" font-weight="normal">※並び方は一例。チームや作戦によって変わります</text>
</svg>
