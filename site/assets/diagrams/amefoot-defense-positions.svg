<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
<title>ディフェンス11人の並び方の一例（4-3）。スクリメージライン沿いにDL4人、その後ろにLB3人、さらに後ろと外側にDB4人（CB2人・S2人）</title>
<rect width="640" height="430" fill="#ffffff"/>
<text x="24" y="217" font-size="14" text-anchor="start" fill="#1f2a44" font-weight="bold">スクリメージライン</text>
<line x1="20" y1="190" x2="620" y2="190" stroke="#1f2a44" stroke-width="2" stroke-dasharray="8 6"/>
<circle cx="240" cy="212" r="12" fill="#9aa3b2" stroke="#1f2a44" stroke-width="1.5"/>
<circle cx="280" cy="212" r="12" fill="#9aa3b2" stroke="#1f2a44" stroke-width="1.5"/>
<circle cx="320" cy="212" r="12" fill="#9aa3b2" stroke="#1f2a44" stroke-width="1.5"/>
<circle cx="360" cy="212" r="12" fill="#9aa3b2" stroke="#1f2a44" stroke-width="1.5"/>
<circle cx="400" cy="212" r="12" fill="#9aa3b2" stroke="#1f2a44" stroke-width="1.5"/>
<text x="470" y="217" font-size="14" text-anchor="start" fill="#1f2a44" font-weight="normal">相手のオフェンスライン</text>
<circle cx="230" cy="168" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="230" y="173.5" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">DL</text>
<circle cx="290" cy="168" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="290" y="173.5" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">DL</text>
<circle cx="350" cy="168" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="350" y="173.5" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">DL</text>
<circle cx="410" cy="168" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="410" y="173.5" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">DL</text>
<circle cx="250" cy="110" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="250" y="115.5" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">LB</text>
<circle cx="320" cy="110" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="320" y="115.5" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">LB</text>
<circle cx="390" cy="110" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="390" y="115.5" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">LB</text>
<circle cx="75" cy="160" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="75" y="165.5" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">CB</text>
<circle cx="565" cy="160" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="565" y="165.5" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">CB</text>
<circle cx="225" cy="50" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="225" y="55.5" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">S</text>
<circle cx="415" cy="50" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="415" y="55.5" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">S</text>
<circle cx="38" cy="267" r="13" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="38" y="271.5" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">DL</text>
<text x="62" y="272" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="bold">ディフェンスライン</text>
<text x="216" y="272" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">相手のラインに当たり、ランを止めQBに迫る</text>
<circle cx="38" cy="297" r="13" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="38" y="301.5" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">LB</text>
<text x="62" y="302" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="bold">ラインバッカー</text>
<text x="184" y="302" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">DLの後ろでランを止める。パスも守る</text>
<circle cx="38" cy="327" r="13" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="38" y="331.5" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">CB</text>
<text x="62" y="332" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="bold">コーナーバック</text>
<text x="184" y="332" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">外側でWRに付いてパスを防ぐ</text>
<circle cx="38" cy="357" r="13" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<text x="38" y="361.5" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">S</text>
<text x="62" y="362" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="bold">セーフティ</text>
<text x="152" y="362" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">最後方でパスやランを防ぐ</text>
<text x="62" y="392" font-size="14" text-anchor="start" fill="#1f2a44" font-weight="normal">CBとSをまとめてDB（ディフェンスバック）。DL4＋LB3＋DB4＝11人</text>
<text x="24" y="422" font-size="14" text-anchor="start" fill="#1f2a44" font-weight="normal">※得点の「セイフティ」とは別のもの。並び方は一例で、チームや作戦で変わります</text>
</svg>
