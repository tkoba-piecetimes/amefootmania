<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
<title>得点の種類。タッチダウン6点、フィールドゴール3点、セイフティ2点、トライ（タッチダウン後の追加プレー）はキック成功1点・ラン／パス成功2点</title>
<rect width="640" height="430" fill="#ffffff"/>
<rect x="14" y="14" width="612" height="90" rx="10" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.5"/>
<rect x="14" y="14" width="112" height="90" rx="10" fill="#2f6fd6"/>
<rect x="100" y="14" width="26" height="90" fill="#2f6fd6"/>
<text x="70" y="71" font-size="30" text-anchor="middle" fill="#ffffff" font-weight="bold">6点</text>
<text x="322" y="42" font-size="18" text-anchor="start" fill="#1f2a44" font-weight="bold">タッチダウン</text>
<text x="322" y="68" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">相手のエンドゾーンにボールを運ぶ</text>
<text x="322" y="90" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">（またはその中でパスをキャッチ）</text>
<rect x="142" y="28" width="160" height="62" fill="#e8f3e8" stroke="#9aa3b2" stroke-width="1"/>
<rect x="262" y="28" width="40" height="62" fill="#cfe3cf" stroke="#9aa3b2" stroke-width="1"/>
<line x1="262" y1="28" x2="262" y2="90" stroke="#1f2a44" stroke-width="3"/>
<circle cx="190" cy="59" r="13" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<ellipse cx="204" cy="59" rx="8" ry="5" fill="#f2a900" stroke="#1f2a44" stroke-width="1.5"/>
<line x1="222" y1="59" x2="282" y2="59" stroke="#1f2a44" stroke-width="2.5"/>
<polygon points="282.0,59.0 273.0,63.5 273.0,54.5" fill="#1f2a44"/>
<rect x="14" y="116" width="612" height="90" rx="10" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.5"/>
<rect x="14" y="116" width="112" height="90" rx="10" fill="#f2a900"/>
<rect x="100" y="116" width="26" height="90" fill="#f2a900"/>
<text x="70" y="173" font-size="30" text-anchor="middle" fill="#1f2a44" font-weight="bold">3点</text>
<text x="322" y="144" font-size="18" text-anchor="start" fill="#1f2a44" font-weight="bold">フィールドゴール</text>
<text x="322" y="170" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">キックしたボールが</text>
<text x="322" y="192" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">ゴールポストの間を通ると成功</text>
<rect x="142" y="130" width="160" height="62" fill="#e8f3e8" stroke="#9aa3b2" stroke-width="1"/>
<path d="M222,194 V170 M196,170 H248 M196,170 V134 M248,170 V134" fill="none" stroke="#1f2a44" stroke-width="3"/>
<ellipse cx="160" cy="182" rx="9" ry="6" fill="#f2a900" stroke="#1f2a44" stroke-width="1.5"/>
<path d="M172,178 Q222,106 270,146" fill="none" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="14" y="218" width="612" height="90" rx="10" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.5"/>
<rect x="14" y="218" width="112" height="90" rx="10" fill="#d64545"/>
<rect x="100" y="218" width="26" height="90" fill="#d64545"/>
<text x="70" y="275" font-size="30" text-anchor="middle" fill="#ffffff" font-weight="bold">2点</text>
<text x="322" y="246" font-size="18" text-anchor="start" fill="#1f2a44" font-weight="bold">セイフティ</text>
<text x="322" y="272" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">攻撃側が自分のエンドゾーン内で</text>
<text x="322" y="294" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">止められるなど → 相手に2点</text>
<rect x="142" y="232" width="160" height="62" fill="#e8f3e8" stroke="#9aa3b2" stroke-width="1"/>
<rect x="142" y="232" width="44" height="62" fill="#cfe3cf" stroke="#9aa3b2" stroke-width="1"/>
<line x1="186" y1="232" x2="186" y2="294" stroke="#1f2a44" stroke-width="3"/>
<circle cx="160" cy="263" r="13" fill="#2f6fd6" stroke="#1f2a44" stroke-width="1.5"/>
<ellipse cx="160" cy="263" rx="7" ry="4.5" fill="#f2a900" stroke="#1f2a44" stroke-width="1.5"/>
<circle cx="214" cy="263" r="13" fill="#d64545" stroke="#1f2a44" stroke-width="1.5"/>
<rect x="14" y="320" width="612" height="90" rx="10" fill="#ffffff" stroke="#9aa3b2" stroke-width="1.5"/>
<rect x="14" y="320" width="112" height="90" rx="10" fill="#3a9a3a"/>
<rect x="100" y="320" width="26" height="90" fill="#3a9a3a"/>
<text x="70" y="377" font-size="30" text-anchor="middle" fill="#ffffff" font-weight="bold">1・2点</text>
<text x="322" y="348" font-size="18" text-anchor="start" fill="#1f2a44" font-weight="bold">トライ（TD後の追加プレー）</text>
<text x="322" y="374" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">キックが成功なら1点、</text>
<text x="322" y="396" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">ランまたはパスが成功なら2点</text>
<rect x="142" y="334" width="160" height="62" rx="6" fill="#f4f7fb" stroke="#9aa3b2" stroke-width="1"/>
<text x="222" y="360" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">キック → 1点</text>
<text x="222" y="384" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">ラン・パス → 2点</text>
</svg>
