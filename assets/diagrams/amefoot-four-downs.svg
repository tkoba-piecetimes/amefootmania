<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
<title>ダウンの仕組み。攻撃は4回の攻撃（ダウン）のうちに10ヤード進めば、また新しく4回の攻撃権が得られる。進めなければ攻守交代</title>
<rect width="640" height="400" fill="#ffffff"/>
<text x="320" y="30" font-size="18" text-anchor="middle" fill="#1f2a44" font-weight="bold">4回の攻撃（ダウン）のうちに10ヤード進めるか</text>
<rect x="30" y="50" width="580" height="130" rx="8" fill="#e8f3e8" stroke="#9aa3b2" stroke-width="1"/>
<line x1="100" y1="50" x2="100" y2="180" stroke="#c7dcc7" stroke-width="1"/>
<line x1="130" y1="50" x2="130" y2="180" stroke="#c7dcc7" stroke-width="1"/>
<line x1="160" y1="50" x2="160" y2="180" stroke="#c7dcc7" stroke-width="1"/>
<line x1="190" y1="50" x2="190" y2="180" stroke="#c7dcc7" stroke-width="1"/>
<line x1="220" y1="50" x2="220" y2="180" stroke="#c7dcc7" stroke-width="1"/>
<line x1="250" y1="50" x2="250" y2="180" stroke="#c7dcc7" stroke-width="1"/>
<line x1="280" y1="50" x2="280" y2="180" stroke="#c7dcc7" stroke-width="1"/>
<line x1="310" y1="50" x2="310" y2="180" stroke="#c7dcc7" stroke-width="1"/>
<line x1="340" y1="50" x2="340" y2="180" stroke="#c7dcc7" stroke-width="1"/>
<line x1="370" y1="50" x2="370" y2="180" stroke="#c7dcc7" stroke-width="1"/>
<line x1="400" y1="50" x2="400" y2="180" stroke="#c7dcc7" stroke-width="1"/>
<line x1="430" y1="50" x2="430" y2="180" stroke="#c7dcc7" stroke-width="1"/>
<line x1="460" y1="50" x2="460" y2="180" stroke="#c7dcc7" stroke-width="1"/>
<line x1="490" y1="50" x2="490" y2="180" stroke="#c7dcc7" stroke-width="1"/>
<line x1="520" y1="50" x2="520" y2="180" stroke="#c7dcc7" stroke-width="1"/>
<line x1="550" y1="50" x2="550" y2="180" stroke="#c7dcc7" stroke-width="1"/>
<line x1="580" y1="50" x2="580" y2="180" stroke="#c7dcc7" stroke-width="1"/>
<ellipse cx="100" cy="125" rx="14" ry="9" fill="#f2a900" stroke="#1f2a44" stroke-width="1.5"/>
<circle cx="74" cy="125" r="15" fill="#2f6fd6"/>
<text x="100" y="168" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">スタート</text>
<line x1="460" y1="52" x2="460" y2="178" stroke="#f2a900" stroke-width="6"/>
<line x1="122" y1="92" x2="452" y2="92" stroke="#1f2a44" stroke-width="2"/>
<polygon points="452.0,92.0 443.0,96.5 443.0,87.5" fill="#1f2a44"/>
<line x1="452" y1="92" x2="122" y2="92" stroke="#1f2a44" stroke-width="2"/>
<polygon points="122.0,92.0 131.0,87.5 131.0,96.5" fill="#1f2a44"/>
<text x="280" y="84" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">10ヤード</text>
<text x="474" y="125" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">シリーズ</text>
<text x="474" y="145" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">獲得線</text>
<text x="582" y="70" font-size="14" text-anchor="end" fill="#1f2a44" font-weight="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">攻める向き →</text>
<rect x="30" y="200" width="136" height="64" rx="8" fill="#dbe7fb" stroke="#2f6fd6" stroke-width="2"/>
<text x="98" y="226" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">1回目の攻撃</text>
<text x="98" y="250" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="normal">第1ダウン</text>
<line x1="167" y1="232" x2="177" y2="232" stroke="#1f2a44" stroke-width="2"/>
<polygon points="177.0,232.0 168.0,236.5 168.0,227.5" fill="#1f2a44"/>
<rect x="178" y="200" width="136" height="64" rx="8" fill="#dbe7fb" stroke="#2f6fd6" stroke-width="2"/>
<text x="246" y="226" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">2回目の攻撃</text>
<text x="246" y="250" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="normal">第2ダウン</text>
<line x1="315" y1="232" x2="325" y2="232" stroke="#1f2a44" stroke-width="2"/>
<polygon points="325.0,232.0 316.0,236.5 316.0,227.5" fill="#1f2a44"/>
<rect x="326" y="200" width="136" height="64" rx="8" fill="#dbe7fb" stroke="#2f6fd6" stroke-width="2"/>
<text x="394" y="226" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">3回目の攻撃</text>
<text x="394" y="250" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="normal">第3ダウン</text>
<line x1="463" y1="232" x2="473" y2="232" stroke="#1f2a44" stroke-width="2"/>
<polygon points="473.0,232.0 464.0,236.5 464.0,227.5" fill="#1f2a44"/>
<rect x="474" y="200" width="136" height="64" rx="8" fill="#dbe7fb" stroke="#2f6fd6" stroke-width="2"/>
<text x="542" y="226" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">4回目の攻撃</text>
<text x="542" y="250" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="normal">第4ダウン</text>
<rect x="30" y="284" width="282" height="100" rx="8" fill="#e3f4e3" stroke="#3a9a3a" stroke-width="2"/>
<text x="171" y="310" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">10ヤード以上進めたら</text>
<text x="171" y="334" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">また「1回目」から4回</text>
<text x="171" y="358" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">攻撃を続けられる</text>
<rect x="328" y="284" width="282" height="100" rx="8" fill="#fbe0e0" stroke="#d64545" stroke-width="2"/>
<text x="469" y="310" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">4回で進めなかったら</text>
<text x="469" y="334" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">攻守交代</text>
<text x="469" y="360" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="normal">（ボールは相手のものに）</text>
</svg>
